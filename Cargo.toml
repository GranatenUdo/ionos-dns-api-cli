[package]
name = "ionos-dns-api-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Small CLI for the IONOS hosting DNS API: store a key, list zones and records, export a zone, verify other nameservers"
license = "MIT"
repository = "https://github.com/GranatenUdo/ionos-dns-api-cli"
readme = "README.md"
keywords = ["ionos", "dns", "cli", "zone-file"]
categories = ["command-line-utilities"]

[[bin]]
name = "ionos-dns"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
